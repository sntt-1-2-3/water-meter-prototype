server:
  port: 8000

spring:
  application:
    name: water-meter-backend
  datasource:
    url: jdbc:sqlite:${SQLITE_PATH:./water.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      # 首次用 create 建表，稳定后改为 none 并走 db/schema.sql
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
  sql:
    init:
      mode: never

jwt:
  # 测试环境密钥，生产必须通过环境变量覆盖
  secret: ${JWT_SECRET:change-me-in-prod-please-use-a-long-random-string-0123456789}
  # 有效期（分钟）
  expire-minutes: ${JWT_EXPIRE_MINUTES:480}

deepseek:
  # 启用后 AI 助手改用 DeepSeek 处理数据（官方 API 或免费网关），未启用则回退本地规则引擎
  enabled: ${DEEPSEEK_ENABLED:false}
  # 官方 API 必需；使用免费网关（token-free-gateway）时留空
  api-key: ${DEEPSEEK_API_KEY:}
  # 官方：https://api.deepseek.com ；免费网关：http://localhost:3456/v1
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.zhishuiyun.water: INFO
    org.hibernate.SQL: WARN
